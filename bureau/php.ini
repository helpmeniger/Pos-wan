; POS Marwa Bureau — configuration PHP (lue par les serveurs lancés par « POS Marwa.exe »)
; Chemins relatifs au dossier php\ : le lanceur fixe le dossier de travail.
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
expose_php = Off
max_execution_time = 300
max_input_time = 120
max_input_vars = 5000
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
; error_log est passé par le lanceur (-d error_log=...\donnees\journaux\php.log)
html_errors = Off
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 128M
upload_max_filesize = 120M
max_file_uploads = 50
default_charset = "UTF-8"
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 30
extension_dir = "ext"
enable_dl = Off

extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=mysqli
extension=sodium
extension=zip
zend_extension=opcache

[Date]
date.timezone = Africa/Niamey

[Session]
session.save_handler = files
; session.save_path : fixé par l'application elle-même (app\storage\sessions)
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 43200
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

[mbstring]
mbstring.language = neutral
