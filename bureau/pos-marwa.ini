; POS Marwa Bureau — réglages (facultatifs). Fermez POS Marwa avant de modifier ce fichier.
[POS Marwa]
; Une ligne commençant par « ; » est ignorée.

; Port de la fenêtre POS Marwa (adresse http://127.0.0.1:8740/ sur ce PC)
PORT_WEB=8740

; Port de la base de données (écoute seulement sur ce PC, jamais sur le réseau)
PORT_BD=3407

; Autres postes du réseau local (tablettes, autres caisses, téléphones) : 1 = autorisé.
; Ils ouvrent alors http://<adresse de ce PC>:8740/ dans leur navigateur. Windows demandera l'autorisation du pare-feu.
; Laissez 0 si POS Marwa n'est utilisé que sur ce PC (plus sûr).
RESEAU=0

; Impression des tickets sans fenêtre d'impression : suit le réglage « Impression automatique du ticket après vente »
; de POS Marwa (Paramètres). 1 = toujours sans fenêtre, même si ce réglage est désactivé ; auto = suivre le réglage.
IMPRESSION_DIRECTE=auto

; Fenêtre : auto (Microsoft Edge, sinon Google Chrome), edge, chrome, ou defaut (navigateur par défaut)
NAVIGATEUR=auto

; Nombre de serveurs PHP (requêtes traitées en même temps) : 8 suffit pour une boutique (2 à 32)
SERVEURS_PHP=8
