# =====================================================================
# POS Wan — hôte virtuel Apache recommandé (WampServer : httpd-vhosts.conf)
# Le DocumentRoot pointe UNIQUEMENT sur le dossier public/.
# =====================================================================
<VirtualHost *:80>
    ServerName pos-wan.local
    DocumentRoot "C:/wamp64/www/pos-wan/public"

    <Directory "C:/wamp64/www/pos-wan/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        # Accès limité au poste local. Pour la boutique entière, remplacer par :
        #   Require ip 192.168.1
        Require local
    </Directory>

    # Masquer la version d'Apache (à placer aussi dans httpd.conf : ServerTokens Prod)
    ServerSignature Off

    ErrorLog "${INSTALL_DIR}/logs/pos-wan-error.log"
    CustomLog "${INSTALL_DIR}/logs/pos-wan-access.log" common
</VirtualHost>

# --- HTTPS (recommandé si plusieurs appareils se connectent en Wi-Fi) ---
# Activer ssl_module, générer un certificat (ex. mkcert pos-wan.local 192.168.1.10),
# puis décommenter et définir SESSION_SECURE=true dans .env.
