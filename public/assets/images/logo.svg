<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" role="img" aria-labelledby="t">
  <title id="t">JOB NIGER</title>
  <!-- Emblème : soleil sahélien (opportunité) au-dessus d'une mallette (travail) -->
  <rect x="2" y="6" width="44" height="44" rx="12" fill="#0B7A5C"/>
  <circle cx="24" cy="21" r="7" fill="#F39A2D"/>
  <rect x="11" y="27" width="26" height="15" rx="3" fill="#FFFFFF"/>
  <rect x="19" y="23.5" width="10" height="5" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
  <rect x="11" y="32" width="26" height="2.4" fill="#0B7A5C"/>
  <text x="56" y="31" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#14213D" letter-spacing="0.5">JOB <tspan fill="#0B7A5C">NIGER</tspan></text>
  <text x="57" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5B6472">Un travail, une opportunité, un revenu.</text>
</svg>
