plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Signature de publication : renseigner keystore.properties (à NE PAS mettre dans le dépôt)
//   storeFile=/chemin/helpme-release.jks  storePassword=…  keyAlias=…  keyPassword=…
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

// Secrets (URL du serveur, clés) : lus depuis secrets.properties, hors du dépôt
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }
def secret = { String k -> '"' + (secrets.getProperty(k, '')) + '"' }

android {
    testOptions { unitTests { includeAndroidResources = true; all { maxHeapSize = '3g' } } }
    namespace 'com.hightechniger.help_me'
    compileSdk 35

    defaultConfig {
        applicationId "com.hightechniger.help_me"
        minSdk 25
        targetSdk 35
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ['HM_SERVER_URL', 'HM_LOGIN_URL', 'HM_API_KEY', 'HM_HMAC_SECRET', 'HM_MANUAL_PASSWORD', 'HM_FORUM_RELAY_KEY'].each { k ->
            buildConfigField 'String', k, secret(k)
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // R8 : supprime le code inutilisé
            shrinkResources true        // supprime les ressources inutilisées
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'   // lecture des codes-barres du manuel
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'
    implementation 'com.airbnb.android:lottie:6.6.2'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'   // captures d'écran des écrans (ScreensTest)
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
