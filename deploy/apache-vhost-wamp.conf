# MARWA — VirtualHost local WampServer (à ajouter dans httpd-vhosts.conf)
# + ajouter « 127.0.0.1 marwa.local » dans C:\Windows\System32\drivers\etc\hosts
<VirtualHost *:80>
    ServerName marwa.local
    DocumentRoot "${INSTALL_DIR}/www/marwa/public"
    <Directory "${INSTALL_DIR}/www/marwa/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        # « Require local » : accessible uniquement depuis ce PC.
        # Pour tester depuis un téléphone du réseau local : Require ip 192.168.1
        Require local
    </Directory>
    ErrorLog "${INSTALL_DIR}/logs/marwa-error.log"
    CustomLog "${INSTALL_DIR}/logs/marwa-access.log" common
</VirtualHost>
