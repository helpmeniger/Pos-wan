# MARWA — Nginx + PHP-FPM (production)
server {
    listen 80;
    server_name marwa.example.ne;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name marwa.example.ne;
    root /var/www/marwa/public;      # SEUL le dossier public est exposé
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/marwa.example.ne/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marwa.example.ne/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    limit_conn marwa_conn 40;            # zones définies dans nginx-marwa-limits.conf

    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ /\. { deny all; }
    location ~* \.(sql|log|env|bak|ini|sh|lock|key)$ { deny all; }
    location /assets/i18n/ { location ~ /_source\.json$ { deny all; } }

    # Connexion et inscription : limite stricte par adresse IP (en plus de l'application)
    location ~ ^/api/auth/(login|token|register|2fa|password/) {
        limit_req zone=marwa_auth burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }
    location /api/ {
        limit_req zone=marwa_api burst=40 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param MARWA_REWRITE 1;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 30s;
    }
    location ~ \.php$ { return 404; }

}
