# MARWA — Apache 2.4 + PHP-FPM en production (Ubuntu/Debian)
# a2enmod rewrite headers ssl proxy_fcgi setenvif && a2enconf php8.2-fpm
<VirtualHost *:80>
    ServerName marwa.example.ne
    Redirect permanent / https://marwa.example.ne/
</VirtualHost>

<VirtualHost *:443>
    ServerName marwa.example.ne
    DocumentRoot /var/www/marwa/public
    <Directory /var/www/marwa/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Rien d'autre que public/ n'est exposé
    <DirectoryMatch "^/var/www/marwa/(app|bin|config|database|storage|routes|tests|vendor)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/marwa.example.ne/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/marwa.example.ne/privkey.pem
    Protocols h2 http/1.1
    LimitRequestBody 6291456

    ErrorLog ${APACHE_LOG_DIR}/marwa-error.log
    CustomLog ${APACHE_LOG_DIR}/marwa-access.log combined
</VirtualHost>
