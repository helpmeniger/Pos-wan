# MARWA — échecs de connexion journalisés par l'application (storage/logs/app-AAAA-MM-JJ.log)
# Exemple de ligne : [2026-10-15 14:02:11] WARNING: Échec de connexion {"ip":"203.0.113.7"}
[Definition]
failregex = ^\[[^\]]+\] WARNING: Échec de connexion \{"ip":"<HOST>"\}
            ^\[[^\]]+\] WARNING: Accès administration refusé \(adresse IP non autorisée\) \{"ip":"<HOST>"\}
ignoreregex =
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
