# MARWA — bannissement des adresses qui multiplient les échecs
[marwa-auth]
enabled  = true
filter   = marwa-auth
logpath  = /var/www/marwa/storage/logs/app-*.log
maxretry = 10
findtime = 10m
bantime  = 1h
port     = http,https

[sshd]
enabled  = true
maxretry = 5
bantime  = 1h

[nginx-limit-req]
enabled  = true
logpath  = /var/log/nginx/error.log
maxretry = 20
findtime = 10m
bantime  = 30m
port     = http,https
