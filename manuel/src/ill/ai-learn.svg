<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 74" width="100%" font-family="Inter, sans-serif"><defs><marker id="a6" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L6 3L0 6z" fill="#6D35D6"/></marker></defs><rect x="3" y="6" width="42" height="56" rx="4" fill="#1F5FA8" opacity=".1"/><rect x="3" y="6" width="42" height="11" rx="4" fill="#1F5FA8"/><text x="24" y="13.6" font-size="4.6" font-weight="800" text-anchor="middle" fill="#fff">Données</text><text x="24" y="27.0" font-size="3.6" text-anchor="middle" fill="#1C2433">Milliers d’exemples</text><text x="24" y="32.4" font-size="3.6" text-anchor="middle" fill="#1C2433">(photos de feuilles</text><text x="24" y="37.8" font-size="3.6" text-anchor="middle" fill="#1C2433">saines ou malades)</text><path d="M46 34h5.5" stroke="#6D35D6" stroke-width="1.1" marker-end="url(#a6)"/><rect x="53" y="6" width="42" height="56" rx="4" fill="#6D35D6" opacity=".1"/><rect x="53" y="6" width="42" height="11" rx="4" fill="#6D35D6"/><text x="74" y="13.6" font-size="4.6" font-weight="800" text-anchor="middle" fill="#fff">Entraînement</text><text x="74" y="27.0" font-size="3.6" text-anchor="middle" fill="#1C2433">L’algorithme ajuste</text><text x="74" y="32.4" font-size="3.6" text-anchor="middle" fill="#1C2433">ses paramètres</text><text x="74" y="37.8" font-size="3.6" text-anchor="middle" fill="#1C2433">pour réduire l’erreur</text><path d="M96 34h5.5" stroke="#6D35D6" stroke-width="1.1" marker-end="url(#a6)"/><rect x="103" y="6" width="42" height="56" rx="4" fill="#4B21A6" opacity=".1"/><rect x="103" y="6" width="42" height="11" rx="4" fill="#4B21A6"/><text x="124" y="13.6" font-size="4.6" font-weight="800" text-anchor="middle" fill="#fff">Modèle</text><text x="124" y="27.0" font-size="3.6" text-anchor="middle" fill="#1C2433">Le « savoir »</text><text x="124" y="32.4" font-size="3.6" text-anchor="middle" fill="#1C2433">appris, enregistré</text><text x="124" y="37.8" font-size="3.6" text-anchor="middle" fill="#1C2433">dans un fichier</text><path d="M146 34h5.5" stroke="#6D35D6" stroke-width="1.1" marker-end="url(#a6)"/><rect x="153" y="6" width="42" height="56" rx="4" fill="#18A04A" opacity=".1"/><rect x="153" y="6" width="42" height="11" rx="4" fill="#18A04A"/><text x="174" y="13.6" font-size="4.6" font-weight="800" text-anchor="middle" fill="#fff">Prédiction</text><text x="174" y="27.0" font-size="3.6" text-anchor="middle" fill="#1C2433">Nouvelle photo :</text><text x="174" y="32.4" font-size="3.6" text-anchor="middle" fill="#1C2433">« mildiou, 94 % »</text><path d="M71 66 C 71 72, 23 72, 23 63" fill="none" stroke="#5B6678" stroke-width=".6" stroke-dasharray="1.6 1.2" marker-end="url(#a6)"/><text x="47" y="72.5" font-size="3.2" text-anchor="middle" fill="#5B6678">on corrige et on recommence des milliers de fois</text></svg>