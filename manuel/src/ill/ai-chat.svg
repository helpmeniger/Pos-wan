<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 112" width="100%" font-family="Inter, sans-serif"><rect x="2" y="2" width="196" height="108" rx="4" fill="#fff" stroke="#94A3B8" stroke-width=".5"/><rect x="2" y="2" width="44" height="108" rx="4" fill="#F2F6FB"/><rect x="40" y="2" width="6" height="108" fill="#F2F6FB"/><rect x="6" y="7" width="36" height="7" rx="2" fill="#fff" stroke="#BDD7EE" stroke-width=".4"/><text x="9" y="11.8" font-size="3.3" fill="#2E74B5" font-weight="700"> Nouvelle discussion</text><text x="8" y="24" font-size="3.2" fill="#1C2433">Lettre de stage</text><text x="8" y="31" font-size="3.2" fill="#1C2433">Formules Excel</text><text x="8" y="38" font-size="3.2" fill="#1C2433">Résumé du cours</text><text x="8" y="45" font-size="3.2" fill="#1C2433">Idées d’exposé</text><text x="8" y="104" font-size="3" fill="#595959"> Paramètres · Confidentialité</text><rect x="96" y="8" width="96" height="20" rx="4" fill="#DEEAF6"/><text x="99" y="13.0" font-size="3.1" fill="#1C2433">Tu es conseiller d’orientation. Je suis en</text><text x="99" y="17.2" font-size="3.1" fill="#1C2433">terminale D au Niger. Propose-moi 3 métiers</text><text x="99" y="21.4" font-size="3.1" fill="#1C2433">liés à l’agriculture et à l’informatique,</text><text x="99" y="25.6" font-size="3.1" fill="#1C2433">sous forme de tableau.</text><circle cx="55" cy="36" r="3.6" fill="#2E74B5"/><text x="55" y="37.6" font-size="4" text-anchor="middle" fill="#fff"></text><text x="61" y="37.4" font-size="3.3" fill="#1C2433">Voici trois métiers d’avenir qui combinent ces domaines :</text><rect x="61" y="42" width="130" height="7" fill="#2E74B5"/><text x="63" y="46.8" font-size="3" fill="#fff" font-weight="700">Métier</text><text x="109" y="46.8" font-size="3" fill="#fff" font-weight="700">Missions</text><text x="155" y="46.8" font-size="3" fill="#fff" font-weight="700">Formation</text><rect x="61" y="49" width="130" height="7" fill="#F2F6FB"/><text x="63" y="53.8" font-size="3" fill="#1C2433" font-weight="400">Technicien en agriculture</text><text x="109" y="53.8" font-size="3" fill="#1C2433" font-weight="400">Capteurs, irrigation</text><text x="155" y="53.8" font-size="3" fill="#1C2433" font-weight="400">BTS, licence</text><rect x="61" y="56" width="130" height="7" fill="#fff"/><text x="63" y="60.8" font-size="3" fill="#1C2433" font-weight="400">Analyste de données agricoles</text><text x="109" y="60.8" font-size="3" fill="#1C2433" font-weight="400">Prévisions, rendements</text><text x="155" y="60.8" font-size="3" fill="#1C2433" font-weight="400">Licence, master</text><rect x="61" y="63" width="130" height="7" fill="#F2F6FB"/><text x="63" y="67.8" font-size="3" fill="#1C2433" font-weight="400">Développeur d’applis agricoles</text><text x="109" y="67.8" font-size="3" fill="#1C2433" font-weight="400">Conseils aux paysans</text><text x="155" y="67.8" font-size="3" fill="#1C2433" font-weight="400">Licence info</text><text x="61" y="76" font-size="3.3" fill="#1C2433">Veux-tu que je détaille les écoles au Niger pour chacun ?</text><text x="61" y="83" font-size="3.4" fill="#595959">⎘  ⟳    </text><rect x="52" y="90" width="140" height="13" rx="6.5" fill="#fff" stroke="#9DC3E6" stroke-width=".6"/><text x="58" y="98" font-size="3.4" fill="#595959">＋  Écrivez votre message…</text><circle cx="185" cy="96.5" r="4.4" fill="#2E74B5"/><text x="185" y="98.2" font-size="4.6" text-anchor="middle" fill="#fff">↑</text><text x="174" y="98.2" font-size="4" text-anchor="middle" fill="#595959"></text><text x="122" y="108" font-size="2.7" text-anchor="middle" fill="#595959">L’IA peut se tromper. Vérifiez les informations importantes.</text><path d="M43 10L43 10" stroke="#E00000" stroke-width=".6"/><circle cx="43" cy="10" r="3.4" fill="#E00000"/><text x="43" y="11.6" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">1</text><path d="M43 33L43 33" stroke="#E00000" stroke-width=".6"/><circle cx="43" cy="33" r="3.4" fill="#E00000"/><text x="43" y="34.6" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">2</text><path d="M192 18L192 18" stroke="#E00000" stroke-width=".6"/><circle cx="192" cy="18" r="3.4" fill="#E00000"/><text x="192" y="19.6" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">3</text><path d="M192 58L192 58" stroke="#E00000" stroke-width=".6"/><circle cx="192" cy="58" r="3.4" fill="#E00000"/><text x="192" y="59.6" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">4</text><path d="M78 83L78 83" stroke="#E00000" stroke-width=".6"/><circle cx="78" cy="83" r="3.4" fill="#E00000"/><text x="78" y="84.6" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">5</text><path d="M52 96.5L52 96.5" stroke="#E00000" stroke-width=".6"/><circle cx="52" cy="96.5" r="3.4" fill="#E00000"/><text x="52" y="98.1" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">6</text><path d="M192 108L192 108" stroke="#E00000" stroke-width=".6"/><circle cx="192" cy="108" r="3.4" fill="#E00000"/><text x="192" y="109.6" font-size="4.4" font-weight="800" text-anchor="middle" fill="#fff">7</text></svg>